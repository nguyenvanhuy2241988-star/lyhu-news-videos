<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:#fff}svg{display:block}
text{font-family:'Inter','Inter Display',sans-serif}
</style></head><body>
<svg width="0" height="0" style="position:absolute"><defs><image id="logo" href="a/logo.png" width="826" height="248"/></defs></svg>
<svg id="s" width="1080" height="1920" viewBox="0 0 1080 1920"></svg>
<script>
const TEAL='#00ABA9',GREEN='#8DC63F',SLATE='#2B4A52',SOFT='#E6F6F5',GREY='#6B7C80',DUR=49.6;
const B=[0,3.2,10.3,19.9,26.0,32.95,36.8,41.95,49.6];
const HEAD=['Bản tin FMCG 24/7','Bán lẻ TP.HCM 9 tháng','Saigon Co.op chuẩn bị Tết 2027','Chi phí nguyên liệu tăng','Chi phí đầu vào nhà sản xuất','Tin này dành cho ai?','Việc nên làm sau tin này','Đọc thêm tin mới nhất'];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const eo=x=>1-Math.pow(1-clamp(x),3);
const ebk=x=>{x=clamp(x);const c=1.70158,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function tx(x,y,s,size,wt,fill,anchor='middle',op=1){return `<text x="${x}" y="${y}" font-size="${size}" font-weight="${wt}" fill="${fill}" text-anchor="${anchor}" opacity="${op}">${s}</text>`}
function rr(x,y,w,h,r,fill,op=1,extra=''){return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${r}" fill="${fill}" opacity="${op}" ${extra}/>`}
function en(lt,d=0,dur=0.45){const p=clamp((lt-d)/dur);return {o:eo(p*1.6),y:(1-eo(p))*50,p}}
function A(lt,d,inner){const e=en(lt,d);return `<g opacity="${e.o}" transform="translate(0 ${e.y})">${inner}</g>`}
function mark(cx,cy,s,fill,op){const r=(dx,dy,rot)=>`<rect x="${-110*s}" y="${-55*s}" width="${220*s}" height="${110*s}" fill="${fill}" opacity="${op}" transform="translate(${cx+dx*s} ${cy+dy*s}) rotate(${rot})"/>`;return r(-95,-95,45)+r(95,-35,45)+r(95,95,45)+r(-95,35,45)}
function pill(cx,y,t,size,fill,col){const w=t.length*size*0.56+80,h=size*1.9;return rr(cx-w/2,y-h/2,w,h,h/2,fill)+tx(cx,y+size*0.35,t,size,800,col)}
function frame(i,t,lt){
 let g=rr(0,0,1080,1920,0,'#fff')+mark(1000,330,1.5,TEAL,0.07)+mark(60,1500,1.2,GREEN,0.10);
 g+=rr(0,0,1080,170,0,SOFT)+`<g transform="translate(50 52) scale(0.26)"><use href="#logo"/></g>`;
 g+=rr(660,56,370,58,29,TEAL)+tx(845,96,'BẢN TIN 18/10/2026',30,800,'#fff');
 if(i>0){g+=rr(0,1700,1080,150,0,TEAL)+rr(0,1700,18,150,0,GREEN)+tx(60,1790,HEAD[i],50,800,'#fff','start')}
 return g}
function scene(i,lt,t){
 let g=frame(i,t,lt),c='';
 const f1=v=>Math.round(v);
 if(i==0){
  c+=A(lt,0.1,tx(540,720,'BẢN TIN',120,900,SLATE)+tx(540,880,'FMCG 24/7',150,900,TEAL));
  c+=A(lt,0.6,pill(540,1050,'Chuyển động FMCG 24/7',46,GREEN,SLATE));
 }
 if(i==1){
  c+=A(lt,0.1,tx(540,380,'BÁN LẺ HÀNG HÓA TP.HCM',62,900,TEAL)+tx(540,470,'9 tháng đầu năm 2026',60,800,SLATE));
  c+=A(lt,0.9,pill(540,1150,'Theo Chi cục Thống kê TP.HCM',44,SOFT,SLATE));
  if(lt>4.2){const p=eo((lt-4.4)/1.3);c+=A(lt-4.2,0.0,tx(540,880,'+'+(17.2*p).toFixed(1).replace('.',',')+'%',250,900,TEAL)+tx(540,990,'doanh thu bán lẻ hàng hóa',58,800,SLATE))}
  else c+=A(lt,0.5,tx(540,800,'Doanh thu',100,900,SLATE)+tx(540,920,'bán lẻ hàng hóa',90,900,TEAL));
 }
 if(i==2){
  c+=A(lt,0.1,tx(540,360,'SAIGON CO.OP',70,900,TEAL)+tx(540,445,'kế hoạch kinh doanh Tết 2027',50,800,SLATE));
  if(lt>2.7){const p=eo((lt-2.8)/1.0);c+=A(lt-2.7,0,rr(110,520,860,300,50,TEAL)+tx(540,700,f1(59*p)+' ngày',150,900,'#fff')+tx(540,780,'thời gian bán Tết',46,700,'#E6F6F5'))}
  if(lt>5.6){const p=eo((lt-5.8)/1.2);c+=A(lt-5.6,0,rr(110,870,860,380,50,SOFT)+tx(540,970,'Hàng dự trữ dự kiến tăng',50,800,GREY)+tx(540,1120,'+'+f1(20*p)+'–'+f1(30*p)+'%',140,900,TEAL)+tx(540,1200,'so với tháng thường',46,700,SLATE))}
  c+=A(lt,0.8,pill(540,1360,'Theo Saigon Co.op',44,GREEN,SLATE));
 }
 if(i==3){
  c+=A(lt,0.1,tx(540,380,'Chi phí nguyên liệu',70,900,SLATE)+tx(540,460,'theo Saigon Co.op',48,700,GREY));
  const p=eo((lt-2.3)/1.2);
  c+=A(lt,0.4,rr(110,540,860,380,50,TEAL))+(lt>2.0?A(lt-2.0,0,tx(540,780,'+'+f1(15*p)+'–'+f1(20*p)+'%',170,900,'#fff')+tx(540,865,'tăng',48,700,'#E6F6F5')):'');
  if(lt>3.9)c+=A(lt-3.9,0,rr(110,980,860,240,50,SOFT)+tx(540,1085,'Cam kết',54,700,GREY)+tx(540,1170,'không tăng giá bán',72,900,TEAL));
 }
 if(i==4){
  c+=A(lt,0.1,tx(540,380,'Một doanh nghiệp sản xuất',58,900,SLATE)+tx(540,455,'cho biết',48,700,GREY));
  const p=eo((lt-2.8)/1.2);
  c+=A(lt,0.4,rr(110,520,860,340,50,TEAL)+tx(540,640,'Chi phí đầu vào',56,800,'#E6F6F5'))+(lt>2.5?A(lt-2.5,0,tx(540,790,'ít nhất +'+f1(20*p)+'%',120,900,'#fff')):'');
  if(lt>4.5)c+=A(lt-4.5,0,rr(110,920,860,300,50,SOFT)+tx(540,1030,'nên sản xuất theo',52,700,GREY)+tx(540,1115,'đơn đặt hàng',84,900,TEAL)+tx(540,1185,'để hạn chế tồn kho',46,700,SLATE));
 }
 if(i==5){
  c+=A(lt,0.1,tx(540,380,'Tin này đáng chú ý với',54,800,GREY));
  c+=A(lt,0.4,rr(110,460,860,260,50,TEAL)+tx(540,640,'Người bán lẻ',112,900,'#fff'));
  c+=A(lt,1.1,rr(110,780,860,330,50,SOFT)+tx(540,900,'Nhà phân phối',90,900,TEAL)+tx(540,1000,'đang chuẩn bị',50,700,GREY)+tx(540,1065,'hàng cuối năm',64,900,SLATE));
 }
 if(i==6){
  c+=A(lt,0.1,tx(540,350,'Việc nên làm',70,900,SLATE));
  c+=A(lt,0.4,rr(110,440,860,330,44,SOFT)+rr(110,440,24,330,12,TEAL)+tx(190,560,'1.',90,900,GREEN,'start')+tx(310,560,'Ghi ra 5 món',64,900,SLATE,'start')+tx(310,650,'bán chạy nhất',50,800,SLATE,'start')+tx(310,725,'dịp cuối năm ngoái',42,700,GREY,'start'));
  c+=A(lt,2.4,rr(110,820,860,330,44,SOFT)+rr(110,820,24,330,12,TEAL)+tx(190,940,'2.',90,900,GREEN,'start')+tx(310,940,'Tính món cần',64,900,SLATE,'start')+tx(310,1030,'đặt trước',64,900,TEAL,'start')+tx(310,1105,'trong tháng này',42,700,GREY,'start'));
 }
 if(i==7){
  c+=A(lt,0.1,tx(540,600,'Đọc thêm tin mới nhất',64,800,GREY)+tx(540,690,'về ngành tại',64,800,GREY)+tx(540,830,'lyhu.com.vn',120,900,TEAL)+pill(540,980,'Mục Tin tức',58,GREEN,SLATE));
  c+=A(lt,1.0,`<g transform="translate(140 1150) scale(0.97)"><use href="#logo"/></g>`);
  c+=A(lt,1.6,tx(540,1500,'Số liệu: Chi cục Thống kê TP.HCM; phát biểu của doanh nghiệp',30,600,GREY));
 }
 return g+`<g transform="translate(0 ${[150,110,110,110,100,100,60,40][i]})">${c}</g>`}
function draw(t){
 let i=0;for(let k=0;k<B.length-1;k++)if(t>=B[k])i=k;
 const lt=t-B[i];let g=scene(i,lt,t);
 if(i>0&&lt<0.3){const p=eo(lt/0.3);g+=`<rect x="0" y="0" width="${1080*(1-p)}" height="1920" fill="${TEAL}"/>`}
 g+=rr(0,1900,1080*t/DUR,20,0,GREEN);
 document.getElementById('s').innerHTML=g}
draw(0)
</script></body></html>
